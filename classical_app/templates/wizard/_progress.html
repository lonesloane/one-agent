<div class="mb-4">
  <div class="progress" style="height: 8px;">
    <div class="progress-bar" role="progressbar"
         style="width: {{ (step / 4 * 100)|int }}%"></div>
  </div>
  <div class="d-flex justify-content-between mt-1">
    <small class="{{ 'fw-bold' if step >= 1 else 'text-muted' }}">Personal Info</small>
    <small class="{{ 'fw-bold' if step >= 2 else 'text-muted' }}">Committees</small>
    <small class="{{ 'fw-bold' if step >= 3 else 'text-muted' }}">Access Rights</small>
    <small class="{{ 'fw-bold' if step >= 4 else 'text-muted' }}">Review</small>
  </div>
</div>
