[project]
name = "one-agent-poc"
version = "0.1.0"
description = "ONE-MP Agent evaluation harness for model exploration"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.0.0",
    "agent-framework-foundry>=1.0.0",
    "azure-identity>=1.19.0",
    "email-validator>=2.0",
    "flask>=3.0",
    "flask-wtf>=1.2",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["classical_app", "eval", "shared"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# --------------------------------------------------------------------------
# Ruff — single source of truth for Python style/format.
# Reviewers MUST NOT re-litigate anything ruff enforces; run ruff instead.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = [
    ".venv",
    ".worktrees",
    "node_modules",
    "plan",
    "docs",
]

[tool.ruff.lint]
# E/W  — pycodestyle (whitespace, line length)
# F    — pyflakes (undefined/unused)
# I    — isort (import order)
# UP   — pyupgrade (modern syntax)
# B    — flake8-bugbear (likely bugs)
# N    — pep8-naming
# SIM  — flake8-simplify
select = ["E", "W", "F", "I", "UP", "B", "N", "SIM"]
ignore = [
    "E501",   # line length handled by formatter; ignore residuals
    "B008",   # FastAPI/Flask use function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "N802",   # test function names can be long/snake-cased freely
    "B011",   # tests may use `assert False`
    "F811",   # pytest fixture parameters look like redefinitions to ruff
    "F401",   # test conftests may re-export fixtures
]
"**/__init__.py" = ["F401"]  # re-exports
"**/conftest.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
